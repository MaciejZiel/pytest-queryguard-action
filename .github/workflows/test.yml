name: Test the action

# Runs the action at the root of this repository (uses: ./) on test-project/,
# with the default package input, so the release's wheel in dist/ is what
# gets installed. The action itself is developed and tested in
# MaciejZiel/pytest-queryguard (action/action.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the finding, do not fail
        id: report
        uses: ./
        with:
          python-version: "3.12"
          working-directory: test-project
          sarif-file: report.sarif
          fail: "false"
          upload: "false"
          compare: "false"
      - name: Check the plugin, the SARIF file and the outputs
        env:
          EXIT_CODE: ${{ steps.report.outputs.exit-code }}
          JSON_FILE: ${{ steps.report.outputs.json-file }}
        run: |
          # the plugin came from the wheel in dist/, not from PyPI
          wheel="$(ls dist/pytest_queryguard-*-py3-none-any.whl)"
          version="$(basename "$wheel" | cut -d- -f2)"
          installed="$(python -c 'import pytest_queryguard; print(pytest_queryguard.__version__)')"
          test "$installed" = "$version"
          python - <<'PY'
          import json, os

          assert os.environ["EXIT_CODE"] == "1", os.environ["EXIT_CODE"]
          with open(os.path.join("test-project", os.environ["JSON_FILE"])) as handle:
              counts = json.load(handle)
          assert counts["complete"] is True, counts
          (finding,) = [
              f for entry in counts["tests"].values() for f in entry["findings"]
          ]
          assert finding["kind"] == "relationship-load", finding
          with open("test-project/report.sarif") as handle:
              document = json.load(handle)
          (result,) = document["runs"][0]["results"]
          assert result["ruleId"] == "queryguard/relationship-load", result
          uri = result["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
          assert uri == "test-project/library.py", uri
          print("ok:", result["message"]["text"].splitlines()[0])
          PY
      - name: Fail on the finding
        id: strict
        continue-on-error: true
        uses: ./
        with:
          working-directory: test-project
          sarif-file: strict.sarif
          upload: "false"
          compare: "false"
          category: strict
      - name: The step must have failed
        env:
          OUTCOME: ${{ steps.strict.outcome }}
        run: test "$OUTCOME" = "failure"
      - name: Accept the finding with the baseline
        id: baseline
        uses: ./
        with:
          working-directory: test-project
          baseline: queryguard-baseline.json
          sarif-file: baseline.sarif
          upload: "false"
          compare: "false"
          category: baseline
      - name: The baseline run passes with no results
        env:
          EXIT_CODE: ${{ steps.baseline.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = "0"
          python -c 'import json; d = json.load(open("test-project/baseline.sarif")); assert d["runs"][0]["results"] == [], d'
